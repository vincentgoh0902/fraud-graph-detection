name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes exact version tags only (no floating v10), so pin one.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml,
      # so CI tests exactly the dependency versions we committed.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest
