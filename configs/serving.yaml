# Phase 6: serving. See docs/decisions.md D-038 to D-041.

# The served model is read from the latest Phase 5 analysis run (its checked refit, D-034).
analysis_experiment: analysis
seed: 0                    # D-039
steps: [35, 49]            # out-of-sample period only (D-040)
top_shap: 10               # SHAP contributions kept per transaction
output_dir: artifacts/serving

# The public demo ships a subset (D-012, D-040, D-042).
demo:
  output_dir: artifacts/space
  alerts_per_step: 20
  hops: 2
  include_labels: false    # D-040: labels stay out of every public demo
  # The published subset (D-042). The static site (D-044) and the Streamlit app both read
  # this exact revision, so they serve the files the parity tests checked.
  dataset_repo: vincentgoh-kaiswee/fraud-graph-detection-demo
  dataset_revision: d87c8399deb7d66c575115f45edc201200614984

# Static demo on GitHub Pages (Phase 7, D-043 to D-045).
site:
  output_dir: build/site
  alerts_k: 100            # top-k alerts per step shipped; the page slices smaller k
  shards_per_step: 16      # full SHAP for other transactions, fetched on demand
  layout_seed: 0           # seeded spring layout for the neighbourhood SVGs

# Query limits (D-040). The API refuses anything larger with 422.
limits:
  max_hops: 3
  max_k: 100
  max_nodes: 500
  max_path_len: 6
  max_paths: 20

# scripts/measure_latency.py (brief section 6: 100 requests per endpoint).
latency:
  experiment: serving
  n_requests: 100
  warmup: 10
  seed: 0
