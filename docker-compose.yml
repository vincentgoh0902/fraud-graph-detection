# The full local stack (Phase 6): Neo4j, the FastAPI service and the Streamlit dashboard.
# Before the first `docker compose up`: load the graph and the predictions into Neo4j and
# export the serving files (README, "Serving"). Every port is bound to localhost only.
services:
  neo4j:
    # 5.26 is the Neo4j 5 LTS line; the image is multi-arch (arm64 included).
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      # Downloads the free Graph Data Science plugin on first start.
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      # ~200k nodes / ~234k edges is small; this leaves room for GDS projections.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      # Bound to localhost only: nothing on the network can reach the database.
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: {context: ., dockerfile: docker/api.Dockerfile}
    environment:
      PORT: 8000
      GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      ARTIFACTS_DIR: /artifacts
    volumes:
      # Read-only: the API only reads the exported scores and SHAP values (D-038).
      - ./artifacts/serving:/artifacts:ro
    ports:
      # Host port overridable (API_HOST_PORT in .env) if 8000 is taken on your machine.
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      neo4j:
        condition: service_healthy

  dashboard:
    build: {context: ., dockerfile: docker/dashboard.Dockerfile}
    environment:
      PORT: 8501
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
