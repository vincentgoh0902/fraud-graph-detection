[project]
name = "fraudgraph"
version = "0.1.0"
description = "Graph-based illicit-transaction detection on the Elliptic Bitcoin dataset"
readme = "README.md"
authors = [
    { name = "vincentgoh0902", email = "e1121484@u.nus.edu" }
]
requires-python = ">=3.12"
# Runtime deps are added phase by phase, so each one has a reason to be here.
dependencies = [
    "matplotlib>=3.11.2",
    "mlflow>=3",
    "neo4j>=6.4.1",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=24",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "kaggle>=1.7",
    "nbconvert>=7.17.2",
    "nbstripout>=0.8",
    "pytest>=8.3",
    "ruff>=0.12",
]
# Training-only deps (Phase 4 GNNs). Serving images install neither group, so they stay
# torch-free (embeddings and scores are precomputed offline).
train = [
    "torch>=2.14.1",
    "torch-geometric>=2.8.1",
]

[tool.uv]
default-groups = ["dev", "train"]

# On Linux (CI), PyPI's torch wheel bundles CUDA (several GB). The CPU-only index has the
# same version without it. macOS wheels from PyPI are already CPU/MPS only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle, I: import sorting, B: likely bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
# The repo's neo4j/ folder (database volumes) would otherwise make ruff treat the
# neo4j driver as first-party.
known-third-party = ["neo4j"]
